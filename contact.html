<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
<!-- Navigation -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html"> My Portfolio
        </a>
        <div>
            <a href="index.html" class="text-black me-3">Home</a>
            <a href="about.html" class="text-black me-3">About</a>
            <a href="contact.html" class="text-black">Contact</a>
        </div>
    </div>
</nav>
<!-- Contact -->
 <section class="container my-5">
    <h1>Contact Me</h1>
    <form id="contactForm">
        <label class="form-label">Name</label>
        <input type="text"
               id="name"
               class="form-control mb-3"
               placeholder="Enter your name">
        <label class="form-label">Email</label>
        <input type="email"
               id="email"
               class="form-control mb-3"
               placeholder="Enter your email">
        <label class="form-label">Message</label>
        <textarea id="message"
                  class="form-control mb-3"
                  rows="4"
                  placeholder="Write your message"></textarea>
        <button type="submit" class="btn btn-primary">Send Message
        </button>
    </form>
</section>
<footer>
    <p>© 2026 My Portfolio</p>
</footer>
<!-- JavaScript -->
<script src="script.js"></script>
</body>
</html>
